<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-labelledby="favtitle">
  <title id="favtitle">Hazard stripe</title>
  <!-- The topbar's caution strip, cut down to a tab icon.

       Bars are six units wide on a twelve unit period, which is roughly three
       times the weight the topbar uses. That is deliberate: the bar there is
       read at 34 CSS pixels of height, this is read at 16, and the topbar's
       own spacing scaled down lands under a pixel per stripe and greys into
       olive. Three black bars is the most a 16px tile can hold and still read
       as hazard tape rather than as texture.

       rotate(-45) is not a guess. It was matched against the live
       repeating-linear-gradient(135deg) by rendering both and comparing, since
       the CSS angle is measured on the gradient axis and the stripes run
       perpendicular to it.

       Colours are PMS 124 and the topbar's own near-black, so the tab, the
       masthead and the planned-project layer are all one palette.

       Note for editors: no double hyphen may appear anywhere in these
       comments. It is illegal inside an XML comment, and while an inlined SVG
       survives it (HTML parses leniently), a browser loading this file through
       rel="icon" parses it as XML and silently renders nothing. -->
  <defs>
    <clipPath id="tile">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#EAAA00"/>
    <g transform="rotate(-45 16 16)" fill="#121212">
      <rect x="-14" y="-12" width="6" height="56"/>
      <rect x="-2" y="-12" width="6" height="56"/>
      <rect x="10" y="-12" width="6" height="56"/>
      <rect x="22" y="-12" width="6" height="56"/>
      <rect x="34" y="-12" width="6" height="56"/>
    </g>
  </g>
</svg>
